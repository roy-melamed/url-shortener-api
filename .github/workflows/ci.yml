name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    name: CI / quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:naming
      - run: npm run typecheck
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm run check:watcher-offline
      - run: npm run test:watcher-offline
      - run: npm test
      - run: npm run build
