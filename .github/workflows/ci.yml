name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    name: CI / quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      rate-limit-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rate_limit_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d rate_limit_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:naming
      - run: npm run typecheck
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm run check:watcher-offline
      - run: npm run test:watcher-offline
      - run: npm test
        env:
          TEST_RATE_LIMIT_DATABASE_URL: postgres://postgres@127.0.0.1:5432/rate_limit_test
      - run: npm run build
