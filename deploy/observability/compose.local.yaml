# Explicit opt-in for NEW disposable development services only.
# Do not run against an existing production/Oracle project or volume.
services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./local-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '127.0.0.1:14318:4318'
      - '127.0.0.1:18889:8889'
  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '127.0.0.1:16686:16686'
